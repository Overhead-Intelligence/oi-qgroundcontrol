; Overhead Intelligence default settings for a fresh QGroundControl-OI install.
;
; How this file works
;   Each section is a QGC settings group and each key is a setting name from
;   src/Settings/<Group>.SettingsGroup.json. OIPlugin::adjustSettingMetaData reads
;   this file when QGC creates a setting and uses the value as that setting's
;   DEFAULT. A value the operator has saved in the app always wins; "Reset to
;   defaults" comes back here.
;
;   [General] holds the groups that have an empty group name in QGC: App
;   (App.SettingsGroup.json) and MAVLink (Mavlink.SettingsGroup.json).
;   Quote any value that contains commas, otherwise QSettings splits it.
;
;   Enum values: units 0 = feet / ft/s / square feet, 1 = metres / m/s / square
;   metres; temperature 0 = Celsius. Firmware class 3 = ArduPilot, vehicle class
;   1 = fixed wing (MAVLink MAV_AUTOPILOT / MAV_TYPE numbers).
;
;   Source: the OI operator settings exported on 2026-05-16 from the previous OI build.

[General]
; OI ground stations identify as MAVLink system 254 (aircraft MAV_GCS_SYSID must match
; for RC override and GCS failsafe; guided commands are not gated on it).
gcsMavlinkSystemID=254
; Plans made without a vehicle connected are for an ArduPilot fixed wing at 21 m/s.
offlineEditingFirmwareClass=3
offlineEditingVehicleClass=1
offlineEditingCruiseSpeed=21

[Units]
horizontalDistanceUnits=1
verticalDistanceUnits=1
areaUnits=1
speedUnits=1
temperatureUnits=0

[FlyView]
; Guided-mode limits: 914.4 m = 3000 ft ceiling, 3048 m = 10000 ft go-to range,
; 152.4 m = 500 ft forward-flight loiter radius.
guidedMaximumAltitude=914.4
maxGoToLocationDistance=3048
forwardFlightGoToLocationLoiterRad=152.4
; "Large Vertical" instrument panel, nose-up compass with the extra indicators.
instrumentQmlFile2=qrc:/qml/QGroundControl/FlightMap/Widgets/VerticalCompassAttitude.qml
lockNoseUpCompass=true
showAdditionalIndicatorsCompass=true

[FlightMode]
; Modes hidden from the ArduPlane mode list. What stays: Auto, RTL, Loiter,
; QuadPlane Loiter, QuadPlane Land, QuadPlane RTL, Loiter to QLand.
apmHiddenFlightModesFixedWing="Manual,Circle,Stabilize,Training,Acro,FBW A,FBW B,Cruise,Autotune,Takeoff,Avoid ADSB,Guided,Initializing,QuadPlane Stabilize,QuadPlane Hover,QuadPlane AutoTune,QuadPlane Acro,Thermal,Autoland"

[GimbalController]
enableOnScreenControl=true
cameraHFov=80
cameraVFov=65

[MavlinkActions]
; Deployed by OIPlugin from custom/res/OI-Actions.json at every start.
flyViewActionsFile=OI-Actions.json

[FirmwareUpgrade]
; Firmware flashing page defaults to ArduPilot.
defaultFirmwareType=3
